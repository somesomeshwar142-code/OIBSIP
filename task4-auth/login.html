<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SecureAuth Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-header">
            <div class="shield-logo">🔑</div>
            <h1>Welcome Back</h1>
            <p>Please enter your credentials to access your account</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="alert-banner" style="display: none;"></div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="loginIdentifier">Username or Email</label>
                <input type="text" id="loginIdentifier" placeholder="e.g. user@example.com or john_doe" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Guard: if already logged in, redirect to dashboard
            if (AuthEngine.getSession()) {
                window.location.href = 'dashboard.html';
                return;
            }

            const loginForm = document.getElementById('loginForm');
            const identifierInput = document.getElementById('loginIdentifier');
            const passwordInput = document.getElementById('loginPassword');
            const alertBox = document.getElementById('alertBox');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const identifier = identifierInput.value.trim();
                const password = passwordInput.value;

                if (!identifier || !password) {
                    AuthEngine.showAlert(alertBox, 'Please enter both username/email and password.', 'danger');
                    return;
                }

                // Authenticate credentials against SHA-256 store
                const result = await AuthEngine.login(identifier, password);

                if (result.success) {
                    AuthEngine.showAlert(alertBox, 'Login successful! Redirecting to dashboard...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    // Generic security message (does NOT reveal which field was wrong)
                    AuthEngine.showAlert(alertBox, result.message, 'danger');
                }
            });
        });
    </script>
</body>
</html>
