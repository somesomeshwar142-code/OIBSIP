<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SecureAuth Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-header">
            <div class="shield-logo">✨</div>
            <h1>Create Account</h1>
            <p>Join SecureAuth with client-side SHA-256 password protection</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="alert-banner" style="display: none;"></div>

        <!-- Registration Form -->
        <form id="registerForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="regUsername">Username</label>
                <input type="text" id="regUsername" placeholder="e.g. john_doe" required>
            </div>

            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" placeholder="e.g. john@example.com" required>
            </div>

            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
                
                <!-- Password Strength Criteria Checklist -->
                <div class="password-criteria">
                    <span id="critMinLength" class="crit-item">✖ At least 8 characters</span>
                    <span id="critHasNumber" class="crit-item">✖ At least 1 number (0-9)</span>
                </div>
            </div>

            <div class="form-group">
                <label for="regConfirmPassword">Confirm Password</label>
                <input type="password" id="regConfirmPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="regSubmitBtn">
                Register Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const registerForm = document.getElementById('registerForm');
            const usernameInput = document.getElementById('regUsername');
            const emailInput = document.getElementById('regEmail');
            const passwordInput = document.getElementById('regPassword');
            const confirmPasswordInput = document.getElementById('regConfirmPassword');
            const alertBox = document.getElementById('alertBox');

            const critMinLength = document.getElementById('critMinLength');
            const critHasNumber = document.getElementById('critHasNumber');

            // Live password requirement validation
            passwordInput.addEventListener('input', () => {
                const val = passwordInput.value;
                
                // 1. Min 8 Chars
                if (val.length >= 8) {
                    critMinLength.classList.add('valid');
                    critMinLength.textContent = '✔ At least 8 characters';
                } else {
                    critMinLength.classList.remove('valid');
                    critMinLength.textContent = '✖ At least 8 characters';
                }

                // 2. At least 1 number
                if (/\d/.test(val)) {
                    critHasNumber.classList.add('valid');
                    critHasNumber.textContent = '✔ At least 1 number (0-9)';
                } else {
                    critHasNumber.classList.remove('valid');
                    critHasNumber.textContent = '✖ At least 1 number (0-9)';
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const username = usernameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (!username || !email || !password || !confirmPassword) {
                    AuthEngine.showAlert(alertBox, 'All fields are required.', 'danger');
                    return;
                }

                if (password !== confirmPassword) {
                    AuthEngine.showAlert(alertBox, 'Passwords do not match.', 'danger');
                    return;
                }

                // Attempt registration using AuthEngine
                const result = await AuthEngine.register(username, email, password);

                if (result.success) {
                    AuthEngine.showAlert(alertBox, 'Account registered successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                } else {
                    AuthEngine.showAlert(alertBox, result.message, 'danger');
                }
            });
        });
    </script>
</body>
</html>
