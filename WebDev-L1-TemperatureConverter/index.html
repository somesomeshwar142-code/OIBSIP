<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter Tool</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="converter-card">
        <!-- HEADER -->
        <header class="card-header">
            <div class="card-icon">
                <i class="fa-solid fa-temperature-half"></i>
            </div>
            <h1 class="card-title">Temperature Converter</h1>
            <p class="card-subtitle">Convert values seamlessly across Celsius, Fahrenheit, & Kelvin.</p>
        </header>

        <!-- FORM INPUTS -->
        <form id="converter-form" onsubmit="return false;">
            <div class="form-group">
                <label for="temp-value" class="form-label">Enter Temperature Value</label>
                <div class="input-row">
                    <input type="number" step="any" id="temp-value" class="input-field" placeholder="e.g. 25" required>
                    <select id="unit-select" class="select-unit">
                        <option value="C">Celsius (°C)</option>
                        <option value="F">Fahrenheit (°F)</option>
                        <option value="K">Kelvin (K)</option>
                    </select>
                </div>
            </div>

            <!-- ERROR ALERT BOX -->
            <div id="error-box" class="error-message">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-text">Please enter a valid numeric value.</span>
            </div>

            <!-- CONVERT BUTTON -->
            <button type="button" id="convert-btn" class="btn-convert">
                <i class="fa-solid fa-calculator"></i> Convert Temperature
            </button>
        </form>

        <!-- RESULT DISPLAY AREA -->
        <section id="results-area" class="results-container">
            <h2 class="results-title">Converted Values</h2>
            <div class="result-cards-grid">
                <div class="result-card">
                    <span class="result-label">Celsius (°C)</span>
                    <span id="res-celsius" class="result-value">--</span>
                </div>
                <div class="result-card">
                    <span class="result-label">Fahrenheit (°F)</span>
                    <span id="res-fahrenheit" class="result-value">--</span>
                </div>
                <div class="result-card">
                    <span class="result-label">Kelvin (K)</span>
                    <span id="res-kelvin" class="result-value">--</span>
                </div>
            </div>
        </section>
    </main>

    <!-- External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
