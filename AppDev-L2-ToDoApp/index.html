<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro | Modern To-Do Web Application</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-wrapper">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">Task<span class="highlight">Flow</span></h1>
                <p class="app-subtitle">Organize your daily workflow seamlessly</p>
            </div>
            <div class="header-right">
                <div class="clock-badge" id="liveClock">Loading time...</div>
            </div>
        </header>

        <!-- Task Input Section -->
        <section class="task-input-section">
            <form id="addTaskForm" class="task-form">
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="What needs to be done today?" autocomplete="off" required>
                    <button type="submit" class="btn btn-add" id="addTaskBtn">
                        <span class="btn-icon">+</span> Add Task
                    </button>
                </div>
            </form>
        </section>

        <!-- Dashboard Grid: Pending & Completed Lists -->
        <main class="dashboard-grid">
            
            <!-- Pending Tasks Column -->
            <section class="task-column">
                <div class="column-header">
                    <h2>Pending Tasks</h2>
                    <span class="badge badge-pending" id="pendingCount">0 pending</span>
                </div>
                
                <div class="task-list-container" id="pendingList">
                    <!-- Dynamic Items injected via JS -->
                </div>

                <!-- Empty State Message -->
                <div class="empty-state" id="pendingEmptyState">
                    <div class="empty-icon">✨</div>
                    <h3>No pending tasks</h3>
                    <p>All caught up! Type a task above to get started.</p>
                </div>
            </section>

            <!-- Completed Tasks Column -->
            <section class="task-column">
                <div class="column-header">
                    <h2>Completed Tasks</h2>
                    <span class="badge badge-completed" id="completedCount">0 completed</span>
                </div>
                
                <div class="task-list-container" id="completedList">
                    <!-- Dynamic Items injected via JS -->
                </div>

                <!-- Empty State Message -->
                <div class="empty-state" id="completedEmptyState">
                    <div class="empty-icon">🎯</div>
                    <h3>No completed tasks yet</h3>
                    <p>Complete a pending task to see it listed here.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
